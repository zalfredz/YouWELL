<!DOCTYPE html>
<html lang="id">
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YouWELL — ruang kecil untuk merasa lebih baik." />
    <title>YouWELL</title>
  </head>
  <body>
    <script src="scripts/platform.js"></script>
    <script>
      (async () => {
        try {
          const registrations = 'serviceWorker' in navigator
            ? await navigator.serviceWorker.getRegistrations()
            : [];
          const wasControlled = Boolean(navigator.serviceWorker?.controller);

          await Promise.all(registrations.map((entry) => entry.unregister()));

          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }

          if (wasControlled && !sessionStorage.getItem('youwell-cache-reset')) {
            sessionStorage.setItem('youwell-cache-reset', 'done');
            window.location.reload();
            return;
          }
        } catch (_) {
          // Cache cleanup must never prevent the app from starting.
        }

        const loader = document.createElement('script');
        loader.src = 'flutter_bootstrap.js';
        loader.async = true;
        document.body.appendChild(loader);
      })();
    </script>
  </body>
</html>
