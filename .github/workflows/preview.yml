name: Validate and build web preview
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none --dart-define-from-file=config/env/production.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: youwell-web-preview
          path: build/web
